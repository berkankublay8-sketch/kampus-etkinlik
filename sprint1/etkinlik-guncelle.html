<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Kampüs Etkinlikleri - Berkan Kublay Sprint 1 HTML projesi">
  <title>Etkinlik Güncelle | Kampüs Etkinlikleri</title>
</head>
<body>
  <header>
    <h1>Etkinlik Güncelle</h1>
  </header>
  <nav aria-label="Ana menü">
    <a href="index.html">Ana Sayfa</a> |
    <a href="etkinlikler.html">Etkinlikler</a> |
    <a href="etkinlik-ekle.html">Etkinlik Ekle</a> |
    <a href="etkinlik-guncelle.html">Etkinlik Güncelle</a>
  </nav>
  <hr>
  <main>
    <p>Alanlar mevcut etkinliğin bilgileriyle dolu gelir. Bu sprintte form verileri kalıcı olarak güncellemez.</p>
    <form action="etkinlik-detay.html" method="get">
      <p>
        <label for="ad">Etkinlik Adı *</label><br>
        <input type="text" id="ad" name="ad" maxlength="80" placeholder="Örn. Kariyer Günleri 2026" value="Kariyer Günleri 2026" required>
      </p>
      <p>
        <label for="kategori">Kategori *</label><br>
        <select id="kategori" name="kategori" required>
          <option value="" >Seçiniz</option>
          <option value="seminer" selected>Seminer</option>
          <option value="atolye">Atölye</option>
          <option value="soylesi">Söyleşi</option>
          <option value="yarisma">Yarışma</option>
        </select>
      </p>
      <p>
        <label for="tarih">Tarih *</label><br>
        <input type="date" id="tarih" name="tarih" value="2026-10-12" required>
      </p>
      <p>
        <label for="saat">Saat *</label><br>
        <input type="time" id="saat" name="saat" value="14:00" required>
      </p>
      <p>
        <label for="yer">Yer *</label><br>
        <input type="text" id="yer" name="yer" maxlength="80" placeholder="Örn. A Blok Konferans Salonu" value="A Blok Konferans Salonu" required>
      </p>
      <p>
        <label for="kontenjan">Kontenjan</label><br>
        <input type="number" id="kontenjan" name="kontenjan" min="1" max="1000" value="120">
      </p>
      <p>
        <label for="aciklama">Açıklama</label><br>
        <textarea id="aciklama" name="aciklama" rows="5" cols="40">Mezunlarla kariyer söyleşileri ve şirket stantları.</textarea>
      </p>
      <p>
        <button type="submit">Güncelle</button>
        <button type="reset">Değişiklikleri geri al</button>
      </p>
    </form>
  </main>
  <footer>
    <hr>
    <p>Berkan Kublay &middot; 2026</p>
  </footer>
</body>
</html>
