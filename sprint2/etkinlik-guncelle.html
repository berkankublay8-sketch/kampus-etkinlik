<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Kampüs Etkinlikleri - Berkan Kublay Sprint 2 CSS ve Responsive Tasarım">
  <title>Etkinlik Güncelle | Kampüs Etkinlikleri</title>
  <link rel="stylesheet" href="css/2321032015.css">
</head>

<body>

  <header>
    <h1>Etkinlik Güncelle</h1>

    <nav aria-label="Ana menü">
      <a href="index.html">Ana Sayfa</a>
      <a href="etkinlikler.html">Etkinlikler</a>
      <a href="etkinlik-ekle.html">Ekle</a>
      <a href="etkinlik-guncelle.html">Güncelle</a>
    </nav>
  </header>

  <main>

    <form class="etkinlik-formu" action="etkinlik-detay.html" method="get">

      <label for="ad">Etkinlik Adı *</label>
      <input
        type="text"
        id="ad"
        name="ad"
        value="Kariyer Günleri 2026"
        maxlength="80"
        required
      >

      <label for="kategori">Kategori *</label>
      <select id="kategori" name="kategori" required>
        <option value="seminer" selected>Seminer</option>
        <option value="atolye">Atölye</option>
        <option value="soylesi">Söyleşi</option>
        <option value="yarisma">Yarışma</option>
      </select>

      <label for="tarih">Tarih *</label>
      <input
        type="date"
        id="tarih"
        name="tarih"
        value="2026-10-12"
        required
      >

      <label for="saat">Saat *</label>
      <input
        type="time"
        id="saat"
        name="saat"
        value="14:00"
        required
      >

      <label for="yer">Yer *</label>
      <input
        type="text"
        id="yer"
        name="yer"
        value="A Blok Konferans Salonu"
        maxlength="80"
        required
      >

      <label for="kontenjan">Kontenjan</label>
      <input
        type="number"
        id="kontenjan"
        name="kontenjan"
        value="120"
        min="1"
        max="1000"
      >

      <label for="aciklama">Açıklama</label>
      <textarea
        id="aciklama"
        name="aciklama"
        rows="5"
      >Mezunlarla kariyer söyleşileri ve şirket stantları.</textarea>

      <div class="form-butonlari">
        <button type="submit">Güncelle</button>
        <button type="reset">Değişiklikleri geri al</button>
      </div>

    </form>

  </main>

  <footer>
    <p>Berkan Kublay · 2321032015 · 2026</p>
  </footer>

</body>
</html>
